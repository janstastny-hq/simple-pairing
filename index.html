<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Pairing | Heureka.cz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --primary-blue: #0072ce;
    --primary-blue-darker: #005ea2;
    --text-dark: #212529;
    --text-secondary: #6c757d;
    --border-color: #dee2e6;
    --background-page: #f8f9fa;
    --background-card: #ffffff;
    --success-color: #28a745;
    --success-soft: #e7f7ee;
    --danger-color: #dc3545;
    --danger-soft: #fdeceb;
    --warning-color: #fd7e14;
    --warning-soft: #fff3e8;
    --neutral-soft: #eceef1;
    --font-family-sans-serif: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --border-radius: .5rem;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font-family-sans-serif); margin: 0; background: var(--background-page); color: var(--text-dark); line-height: 1.5; font-size: 14px; }
  .page { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  .page-header { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
  .page-lede { color: var(--text-secondary); max-width: 760px; margin: 0 0 28px; font-size: 14.5px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .sort-group { display: flex; align-items: center; gap: 10px; }
  .sort-label { font-weight: 600; color: var(--text-dark); font-size: 14px; }
  .segmented { display: inline-flex; flex-wrap: wrap; background: #eef0f2; border-radius: 10px; padding: 4px; gap: 2px; }
  .segmented button {
    border: none; background: transparent; padding: 7px 16px; border-radius: 8px; font-size: 13.5px;
    color: var(--text-secondary); font-family: inherit; cursor: pointer; font-weight: 500;
  }
  .segmented button.active { background: #fff; color: var(--text-dark); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .progress-line { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-btn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--background-card); border: 1px solid var(--border-color);
    border-radius: 10px; padding: 8px 14px; font-size: 13.5px; color: var(--text-secondary); cursor: pointer; font-family: inherit;
    transition: all .15s ease;
  }
  .stat-btn:hover { border-color: #b9c1c9; }
  .stat-btn b { color: var(--text-dark); font-size: 14.5px; }
  .stat-btn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .stat-btn.tint-parovano:not(.active) { background: var(--success-soft); border-color: #b7e4cf; }
  .stat-btn.tint-parovano:not(.active) b { color: #12805c; }
  .stat-btn.tint-nesparovano:not(.active) { background: var(--danger-soft); border-color: #f5c6c1; }
  .stat-btn.tint-nesparovano:not(.active) b { color: var(--danger-color); }
  .stat-btn.tint-kontrola:not(.active) { background: var(--neutral-soft); border-color: #d7dbe0; }
  .stat-btn.tint-kontrola:not(.active) b { color: var(--text-dark); }
  .stat-btn.active { border-color: var(--primary-blue); background: #eaf2fb; box-shadow: 0 0 0 1px var(--primary-blue) inset; }
  .stat-btn.total { cursor: default; }
  .stat-btn.total:hover { border-color: var(--border-color); }

  .list-header { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 14px; }
  .list-header h2 { font-size: 18px; margin: 0; }
  .back-link { background: none; border: none; color: var(--primary-blue); font-size: 13.5px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; padding: 0; }
  .back-link:hover { text-decoration: underline; }

  .problem-filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .problem-filter-btn {
    border: 1px solid var(--border-color); background: var(--background-card); color: var(--text-secondary);
    border-radius: 16px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px; transition: all .15s ease;
  }
  .problem-filter-btn:hover:not(.active) { border-color: #b9c1c9; }
  .problem-filter-btn.active { border-color: var(--primary-blue); background: #eaf2fb; color: var(--primary-blue); font-weight: 700; }
  .problem-filter-btn .count { font-size: 11.5px; font-weight: 700; }

  .list-row {
    display: flex; align-items: center; gap: 16px; background: var(--background-card); border: 1px solid var(--border-color);
    border-radius: 12px; padding: 14px 18px; margin-bottom: 10px;
  }
  .list-row .row-thumb {
    width: 44px; height: 44px; border-radius: 8px; background: linear-gradient(135deg,#eef1f5,#e2e6eb);
    display: flex; align-items: center; justify-content: center; font-size: 17px; color: #9aa4b2; flex-shrink: 0;
  }
  .list-row .row-main { flex: 1 1 auto; min-width: 0; }
  .list-row .row-name { font-weight: 700; font-size: 14.5px; color: var(--text-dark); margin-bottom: 3px; }
  .list-row .row-meta { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .row-price { font-weight: 700; font-size: 14.5px; flex: 0 0 90px; text-align: right; }
  .list-row .row-badge { flex: 0 0 auto; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  .row-badge.matched { background: var(--success-soft); color: #12805c; }
  .row-badge.unmatched { background: var(--danger-soft); color: var(--danger-color); }
  .row-badge.kontrola { background: var(--warning-soft); color: #9a5b00; }
  .list-row .row-action { flex: 0 0 auto; }
  .empty-list { text-align: center; padding: 50px 20px; color: var(--text-secondary); background: var(--background-card); border: 1px dashed var(--border-color); border-radius: 12px; }

  .toast { background: var(--success-soft); border: 1px solid #b7e4cf; color: #12805c; padding: 10px 16px; border-radius: var(--border-radius); font-size: 13.5px; font-weight: 500; margin-bottom: 18px; display: none; }
  .toast.show { display: block; }

  .match-row { display: flex; align-items: stretch; gap: 18px; margin-top: 22px; }
  @media (max-width: 900px) { .match-row { flex-direction: column; } }

  .offer-card {
    flex: 1 1 360px; max-width: 400px; background: var(--background-card); border: 1px solid var(--border-color);
    border-radius: 14px; padding: 20px; display: flex; flex-direction: column;
  }
  .offer-thumb {
    width: 84px; height: 84px; border-radius: 10px; background: linear-gradient(135deg,#eef1f5,#e2e6eb);
    display: flex; align-items: center; justify-content: center; font-size: 30px; color: #9aa4b2; margin-bottom: 14px;
  }
  .offer-name { font-weight: 700; font-size: 16px; color: var(--text-dark); text-decoration: underline; text-decoration-color: #c7ccd1; margin: 0 0 10px; line-height: 1.35; }
  .offer-meta { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .offer-price { font-weight: 700; font-size: 18px; margin-top: auto; padding-top: 10px; }

  .arrow-col { flex: 0 0 46px; display: flex; align-items: center; justify-content: center; color: #c7ccd1; font-size: 20px; }
  @media (max-width: 900px) { .arrow-col { transform: rotate(90deg); margin: -6px auto; } }

  .status-box {
    flex: 1 1 420px; border: 2px dashed #d7dbe0; border-radius: 14px; background: #fafbfc;
    padding: 26px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; gap: 6px;
  }
  .status-box.is-matched { border-style: solid; border-color: #b7e4cf; background: var(--success-soft); text-align: left; align-items: flex-start; justify-content: flex-start; }
  .status-box .empty-icon { margin-bottom: 8px; }
  .status-box .empty-text { color: var(--text-secondary); font-size: 14px; max-width: 320px; }

  .matched-head { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #12805c; font-size: 14.5px; margin-bottom: 10px; }
  .matched-name { font-weight: 700; font-size: 15.5px; color: var(--text-dark); margin-bottom: 4px; }
  .matched-cat { font-size: 12.5px; color: var(--text-secondary); }

  .name-editor { width: 100%; margin-top: 16px; text-align: left; border-top: 1px dashed #d7dbe0; padding-top: 16px; }
  .name-editor label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
  .name-editor input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px;
    font-family: inherit; margin-bottom: 10px;
  }
  .name-editor input:focus { outline: none; border-color: var(--primary-blue); box-shadow: 0 0 0 .2rem rgba(0,114,206,.2); }
  .rule-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 6px; border: 1px solid transparent; }
  .chip.ok { background: var(--success-soft); color: #12805c; border-color: #b7e4cf; }
  .chip.missing { background: var(--danger-soft); color: var(--danger-color); border-color: #f5c6c1; }
  .chip.manual { background: #eaf2fb; color: var(--primary-blue); border-color: #cfe2f6; }
  .all-good { font-size: 13px; color: #12805c; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 2px; }

  .cat-missing-inline { color: var(--danger-color); font-style: italic; }
  .category-picker { width: 100%; text-align: left; }
  .cat-invalid-note { font-size: 12.5px; color: var(--danger-color); background: var(--danger-soft); border: 1px solid #f5c6c1; border-radius: 6px; padding: 7px 10px; margin-bottom: 10px; }
  .category-picker label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
  .category-picker input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px;
    font-family: inherit; margin-bottom: 4px;
  }
  .category-picker input:focus { outline: none; border-color: var(--primary-blue); box-shadow: 0 0 0 .2rem rgba(0,114,206,.2); }
  .category-results { max-height: 220px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 8px; background: #fff; }
  .category-results .cat-option {
    display: flex; flex-direction: column; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #f0f1f3;
  }
  .category-results .cat-option:last-child { border-bottom: none; }
  .category-results .cat-option:hover { background: #eaf2fb; }
  .category-results .cat-option .cat-leaf { font-weight: 600; font-size: 13.5px; color: var(--text-dark); }
  .category-results .cat-option .cat-parent { font-size: 11.5px; color: var(--text-secondary); }
  .category-results .cat-empty { padding: 12px; font-size: 13px; color: var(--text-secondary); text-align: center; }
  .category-chosen {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--success-soft);
    border: 1px solid #b7e4cf; border-radius: 8px; padding: 10px 12px; margin-top: 4px;
  }
  .category-chosen .cat-chosen-text { font-size: 13.5px; font-weight: 600; color: #12805c; }
  .category-chosen .cat-change-link { background:none; border:none; color: var(--primary-blue); font-size: 12.5px; text-decoration: underline; cursor: pointer; font-family: inherit; flex-shrink: 0; }

  .actions-col { flex: 0 0 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  @media (max-width: 900px) { .actions-col { flex-direction: row; } }
  .btn-primary {
    background: var(--primary-blue); color: #fff; border: none; padding: 11px 22px; border-radius: 8px;
    font-size: 14.5px; font-weight: 600; cursor: pointer; width: 100%; transition: background .15s ease;
  }
  .btn-primary:hover { background: var(--primary-blue-darker); }
  .btn-primary:disabled { background: #b9d4ea; cursor: not-allowed; }
  .btn-link { background: none; border: none; color: var(--text-secondary); font-size: 13.5px; text-decoration: underline; cursor: pointer; font-family: inherit; }
  .btn-link:hover { color: var(--text-dark); }
  .btn-secondary-link { background: none; border: none; color: var(--primary-blue); font-size: 13px; text-decoration: underline; cursor: pointer; font-family: inherit; padding: 0; margin-top: 4px; }

  .done-panel { text-align: center; padding: 70px 20px; background: var(--background-card); border: 1px solid var(--border-color); border-radius: 14px; margin-top: 22px; }
  .done-panel i { font-size: 40px; color: var(--success-color); margin-bottom: 14px; }
  .done-panel h2 { margin: 0 0 8px; font-size: 20px; }
  .done-panel p { color: var(--text-secondary); margin: 0 0 20px; }

  .sock-icon { width: 56px; height: 56px; }

  @media (max-width: 480px) {
    .sort-group { width: 100%; flex-direction: column; align-items: flex-start; }
    .segmented { width: 100%; }
    .segmented button { flex: 1 1 auto; }
  }

  @media (max-width: 620px) {
    .list-row { flex-wrap: wrap; }
    .list-row .row-main { flex: 1 1 100%; order: 1; }
    .list-row .row-thumb { order: 0; }
    .list-row .row-price { order: 2; flex: 0 0 auto; text-align: left; margin-left: 60px; }
    .list-row .row-badge { order: 3; }
    .list-row .row-action { order: 4; margin-left: auto; }
  }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-header">Simple Pairing</h1>
  <p class="page-lede">Všechny nabídky z vašeho feedu procházíme automaticky přes shodu EAN kódu. Tady je projdete jednu po druhé — u shody stačí párování potvrdit, u nabídky bez shody rovnou opravíte název podle toho, co jí podle vzoru kategorie na Heurece chybí, a pošlete ji ke kontrole.</p>

  <div class="toolbar">
    <div class="progress-line" id="progressLine"></div>
    <div class="sort-group">
      <span class="sort-label">Seřadit:</span>
      <div class="segmented" id="sortSeg">
        <button data-sort="abc" class="active">Abecedně</button>
        <button data-sort="priceDesc">Od nejdražších</button>
        <button data-sort="priceAsc">Od nejlevnějších</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="content"></div>
</div>

<script>
(async function () {
  /* ============ VALIDÁTOR NÁZVU (stejná logika jako Feed validátor / Přehled spárovanosti) ============ */
  let RULES = {}, PARAMS = {}, CATEGORIES = [];
  try {
    const proto = await (await fetch('./proto-data.json')).json();
    RULES = proto.rules || {}; PARAMS = proto.params || {}; CATEGORIES = proto.categories || [];
  } catch (e) { console.error('proto-data.json se nepodařilo načíst', e); }

  const fold = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

  // Pro výběr kategorie: ukazujeme jen koncovou (poslední) kategorii, ale k nabídce se uloží celá cesta.
  const CATEGORY_OPTIONS = CATEGORIES.map(full => {
    const parts = full.split('|').map(s => s.trim());
    const leaf = parts[parts.length - 1];
    return { full, leaf, parent: parts.slice(-3, -1).join(' | '), foldedLeaf: fold(leaf) };
  });
  // Kategorie je "platná", jen pokud přesně odpovídá existující koncové cestě ve stromu Heureky.
  // Pokud ne, jde o příliš obecnou/neexistující kategorii (např. jen "Elektronika" bez dalšího zařazení).
  const VALID_CATEGORY_SET = new Set(CATEGORIES.map(c => c.trim()));
  const isValidCategory = text => VALID_CATEGORY_SET.has((text || '').trim());
  function dejZakladSlova(slovo) {
    slovo = fold(slovo);
    if (slovo.length <= 3) return slovo;
    const konc = ['ova','ove','ovy','ovou','oveho','ovemu','ovych','ovym','ovymi','ami','em','ech','ich','um','ou','am','y','e','a','i','o','u'];
    for (const k of konc) { if (slovo.endsWith(k)) { const r = slovo.slice(0, -k.length); if (r.length >= 3) return r; break; } }
    return slovo;
  }
  function najdiPresne(leaf, db) {
    const k = (leaf || '').toLowerCase().trim();
    if (Object.prototype.hasOwnProperty.call(db, k)) return db[k];
    const z = dejZakladSlova(k);
    for (const kd in db) { if (dejZakladSlova(kd) === z) return db[kd]; }
    return null;
  }
  const parseParams = t => (t ? t.split(',').map(s => s.trim()).filter(Boolean) : []);
  const splitRule = r => { if (!r) return { format: '', example: '' }; const m = r.match(/\s[–—]\s/); if (!m) return { format: r.trim(), example: '' }; const i = r.indexOf(m[0]); return { format: r.slice(0, i).trim(), example: r.slice(i + m[0].length).trim() }; };
  const leafOf = ct => (ct || '').split('|').pop().trim().toLowerCase();

  const BARVY = ['cern','bil','cerven','modr','zelen','zlut','oranzov','fialov','ruzov','hned','bezov','zlat','stribr','tyrkys','khaki','antracit','bordo','purpur','azur','kremov','smetanov','vinov','grafit','olivov','lososov','koralov','indigov','marengo','petrolej'];
  const MATERIALY = ['bavln','polyester','kuze','usen','drev','sklo','plast','nerez','kov','guma','silikon','vlna','vlnen','len','lnen','hedvab','keramik','porcelan'];
  const PRICHUTE = ['kure','hovez','kral','jehnec','kachn','krut','losos','tunak','drubez','telec','zverin','sardin','tresk','kreve','jelen','vepr','pstruh','ryba','rybi','jahod','cokolad','vanilk','banan','orisk','orech','karamel','kokos','malin','boruvk','visn','citron','pomeranc','jablk','hrusk','mango','meloun','brosk','kava','skoric','pistac','ananas','limetk','oreo','tiramis','slany'];
  const URCENI = ['adult','junior','senior','kitten','puppy','stenat','stene','dospel','detsk','kastrov','steriliz','large breed','small breed'];
  const KONZISTENCE = ['v zele','ve stav','v omacc','pastik','mousse','pena','krem','prasek','tablet','kapsl','sirup','tekut','granul','susen','koncentrat','pate'];
  const slovnikHit = (dic, name) => { const f = fold(name); return dic.some(r => r.includes(' ') ? f.includes(r) : new RegExp('\\b' + r).test(f)); };
  const POCET_UNITS = ['ks','kus\\w*','pack','balen\\w*','tablet\\w*','kapsl\\w*','tobol\\w*','sac\\w*','porc\\w*','dn[ií]','dni','ampul\\w*'];
  const numUnit = (f, units) => new RegExp('\\b\\d+([.,]\\d+)?\\s?(' + units.join('|') + ')\\b').test(f);
  const DRUH_MLETI = ['zrnkov','mlet','mlynek','celozrn','instant'];
  const BARVY_EN = ['black','white','blue','red','green','yellow','orange','purple','pink','brown','grey','gray','gold','silver','navy','beige','turquoise','violet','graphite','midnight','starlight'];
  const BARVY_EN_MULTI = ['space gray','space grey','rose gold','jet black','sky blue'];
  const jeBarva = f => BARVY.some(r => new RegExp('\\b' + r).test(f)) || /\bsed[aeiy]/.test(f) || /\bsiv/.test(f) || /barevn/.test(f) || /\bpruhledn/.test(f) || /\btransparent/.test(f) || /\bcir[aey]/.test(f)
    || BARVY_EN.some(r => new RegExp('\\b' + r + '\\b').test(f)) || BARVY_EN_MULTI.some(r => f.includes(r));
  function jeKod(name) {
    return name.split(/\s+/).some(t => {
      const c = t.replace(/[.,;:()]/g, '');
      if (/^\d{5,}$/.test(c)) return true;
      const p = (c.match(/[a-zA-Z]/g) || []).length, d = (c.match(/\d/g) || []).length;
      return p >= 2 && d >= 1 && c.length >= 4;
    });
  }
  function detekujSlozku(slot, name, manufacturer) {
    const f = fold(name);
    switch (slot) {
      case 'objem':    return numUnit(f, ['ml','cl','dl','l','litr\\w*']);
      case 'hmotnost': return numUnit(f, ['mg','dkg','kg','g','gr','gram\\w*']);
      case 'rozmer':   return /\d+([.,]\d+)?\s?[x×]\s?\d/.test(f) || numUnit(f, ['mm','cm','m']);
      case 'barva':    return jeBarva(f);
      case 'material': return MATERIALY.some(m => new RegExp('\\b' + m).test(f));
      case 'velikost': return /\b(XXS|XS|S|M|L|XL|XXL|XXXL)\b/.test(name) || /\bvel\.?\s*\w/.test(f);
      case 'pamet':    return /\b\d+([.,]\d+)?\s?(gb|tb|mb)\b/.test(f);
      case 'pocet':    return new RegExp('\\b\\d+\\s?(' + POCET_UNITS.join('|') + ')\\b').test(f) || /\b\d+\s?[x×]\s?\d/.test(f);
      case 'kod':      return jeKod(name);
      case 'nazev':    return name.trim().length > 0;
      case 'druhmleti':   return slovnikHit(DRUH_MLETI, name);
      case 'prichut':     return slovnikHit(PRICHUTE, name);
      case 'urceni':      return slovnikHit(URCENI, name);
      case 'konzistence': return slovnikHit(KONZISTENCE, name);
      case 'znacka':   return manufacturer ? f.includes(fold(manufacturer)) : null;
      default:         return null;
    }
  }
  function klasifikujSlozku(label) {
    const f = fold(label);
    if (f.includes('objem')) return 'objem';
    if (f.includes('hmotnost') || f.includes('vaha') || f.includes('gramaz')) return 'hmotnost';
    if (f.includes('rozmer') || f.includes('delka') || f.includes('prumer')) return 'rozmer';
    if (f.includes('pamet') || f.includes('uloz')) return 'pamet';
    if (f.includes('velikost')) return 'velikost';
    if (f.includes('barva') || f.includes('barevn') || f.includes('odstin')) return 'barva';
    if (f.includes('material')) return 'material';
    if (f.includes('cislo') || f.includes('kod') || f.includes('oznaceni')) return 'kod';
    if (f.includes('pocet') || f.includes('mnozstvi')) return 'pocet';
    if (f.includes('mleti')) return 'druhmleti';
    if (f.includes('prichut')) return 'prichut';
    if (f.includes('urceni')) return 'urceni';
    if (f.includes('konzistenc')) return 'konzistence';
    if (f.includes('nazev')) return 'nazev';
    if (f.includes('znacka') || f.includes('vyrobce')) return 'znacka';
    return null;
  }
  function vzorTokeny(format) {
    return format.split('|').map(t => {
      t = t.trim();
      const m = t.match(/^(.*?)\s*\((.*)\)\s*$/);
      return { label: (m ? m[1] : t).trim(), optional: !!m && /pokud/i.test(m[2]) };
    }).filter(t => t.label);
  }
  function analyzujNazev(ruleFormat, name, manufacturer) {
    return vzorTokeny(ruleFormat).map(t => {
      const slot = klasifikujSlozku(t.label);
      const res = slot ? detekujSlozku(slot, name, manufacturer) : null;
      let stav = 'rucne';
      if (res === true) stav = 'je';
      else if (res === false) stav = t.optional ? 'nepovinne' : 'chybi';
      return { label: t.label, stav };
    });
  }
  function diagnostikaNazvu(offer, name) {
    const leaf = leafOf(offer.categoryText);
    const rule = najdiPresne(leaf, RULES);
    if (!rule) return null;
    const format = splitRule(rule).format;
    const komponenty = analyzujNazev(format, name, offer.manufacturer);
    return { format, komponenty, chybejici: komponenty.filter(k => k.stav === 'chybi').map(k => k.label) };
  }

    let list = [...notPostponed, ...isPostponed];
    if (pinnedId) {
      const idx = list.findIndex(o => o.id === pinnedId);
      if (idx > 0) { const [p] = list.splice(idx, 1); list.unshift(p); }
    }

  }

  function wireOfferCard(o, cardEl) {
    const needsCategory = !o.categoryText || !isValidCategory(o.categoryText) || forceRecat.has(o.id);

    if (o.matched) {
      cardEl.querySelector('[data-act="confirm"]').addEventListener('click', () => {
        o.status = 'parovano'; postponed.delete(o.id);
        if (pinnedId === o.id) pinnedId = null;
        showToast(`✓ „${o.name}“ bylo spárováno.`);
        render();
      });
      cardEl.querySelector('[data-act="notmatch"]').addEventListener('click', () => {
        o.matched = false; hideToast(); render();
      });
    } else if (needsCategory) {
      const catInput = cardEl.querySelector(`#categoryInput-${o.id}`);
      catInput.addEventListener('input', () => {
        categorySearch[o.id] = catInput.value;
        cardEl.querySelector(`#categoryResults-${o.id}`).innerHTML = categoryResultsHTML(catInput.value);
      });
      cardEl.querySelector(`#categoryResults-${o.id}`).addEventListener('click', e => {
        const opt = e.target.closest('.cat-option');
        if (!opt) return;
        o.categoryText = opt.dataset.full;
        forceRecat.delete(o.id);
        delete categorySearch[o.id];
        hideToast(); render();
      });
      cardEl.querySelector('[data-act="postpone"]').addEventListener('click', () => {
        postponed.add(o.id);
        if (pinnedId === o.id) pinnedId = null;
        hideToast(); render();
      });

    renderProgress();
    const content = document.getElementById('content');
    if (viewMode === 'parovano' || viewMode === 'kontrola') { renderListView(viewMode); return; }

    // Výchozí pohled = VŠECHNY nespárované nabídky pod sebou jako plné karty (žádné "otevírání").
    let queue = currentQueue();
    if (!queue.length) {
      const c = counts();
      content.innerHTML = `
        <div class="done-panel">
          <i class="fas fa-circle-check"></i>
          <h2>Všechny nabídky zpracované</h2>
          <p>Spárováno: ${c.parovano} · Odesláno ke kontrole: ${c.kontrola} z celkem ${c.total} nabídek.</p>
          <button class="btn-primary" style="width:auto;" id="resetBtn">Začít znovu</button>
        </div>`;
      document.getElementById('resetBtn').addEventListener('click', () => {
        offers.forEach(o => {
          o.status = 'pending';
          const snap = initialSnapshot[o.id];
          if (snap) { o.name = snap.name; o.categoryText = snap.categoryText; }
        });
        postponed.clear(); forceRecat.clear();
        Object.keys(editedNames).forEach(k => delete editedNames[k]);
        Object.keys(categorySearch).forEach(k => delete categorySearch[k]);
        pinnedId = null; viewMode = 'nesparovano'; problemFilter = 'all';
        hideToast(); render();
      });
      return;
    }

    const byType = {};
    queue.forEach(o => { const t = problemType(o); byType[t] = (byType[t] || 0) + 1; });
    const filtered = problemFilter === 'all' ? queue : queue.filter(o => problemType(o) === problemFilter);
    const chip = (key, label, count) => `
      <button type="button" class="problem-filter-btn${problemFilter === key ? ' active' : ''}" data-filter="${key}">
        ${escapeHTML(label)} <span class="count">${count}</span>
      </button>`;
    const filterBarHTML = `<div class="problem-filter-bar">
      ${chip('all', 'Vše', queue.length)}
      ${Object.keys(PROBLEM_LABELS).map(key => byType[key] ? chip(key, PROBLEM_LABELS[key].label, byType[key]) : '').join('')}
    </div>`;

    content.innerHTML = `
      <div class="list-header">
        <h2>Nespárované nabídky <span style="color:var(--text-secondary); font-weight:400; font-size:14px;">(${filtered.length})</span></h2>
      </div>
      ${filterBarHTML}
      ${filtered.length ? filtered.map(renderOfferCardHTML).join('') : `<div class="empty-list">Žádné nabídky neodpovídají zvolenému filtru.</div>`}`;

    content.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
      problemFilter = b.dataset.filter; render();
    }));
    filtered.forEach(o => {
      const cardEl = content.querySelector(`.match-row[data-oid="${o.id}"]`);
      if (cardEl) wireOfferCard(o, cardEl);
    });
    if (pinnedId) {
      const pinnedEl = content.querySelector(`.match-row[data-oid="${pinnedId}"]`);
      if (pinnedEl) pinnedEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  document.getElementById('sortSeg').addEventListener('click', e => {
    const btn = e.target.closest('button[data-sort]');
    if (!btn) return;
    sortMode = btn.dataset.sort;
    document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  render();
})();
</script>
</body>
</html>
